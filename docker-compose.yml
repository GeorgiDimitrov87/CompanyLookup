services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: companyintel
      POSTGRES_PASSWORD: companyintel
      POSTGRES_DB: company_intel
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companyintel -d company_intel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    # Host ports are shifted off the defaults so this stack can run alongside
    # other local projects. In-container ports are unchanged, so service-to-service
    # URLs (redis:6379, searxng:8080, backend:8000) stay the same.
    image: redis:7-alpine
    ports:
      - "6385:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "8088:8080"
    environment:
      SEARXNG_BASE_URL: http://localhost:8088
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8011:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started

  worker:
    build: ./backend
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started

  flower:
    image: mher/flower:2.0
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3003:3000"
    environment:
      # Evaluated in the browser, so these must use backend's published host
      # port (8011), not the in-container port 8000.
      NEXT_PUBLIC_API_URL: http://localhost:8011
      NEXT_PUBLIC_WS_URL: ws://localhost:8011
    depends_on:
      - backend

volumes:
  pgdata:
